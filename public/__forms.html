<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>CKEFA enquiry form definition</title></head>
  <body>
    <!-- Netlify parses this static HTML at deploy time, so fields match the React form. -->
    <form name="ckefa-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ckefa-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
